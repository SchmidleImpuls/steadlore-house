id: smart-home-controls-not-working
symptom: Lights or automations are not working
applies_to:
  - home-assistant
plain_summary: The household smart-home control system may be unavailable. This can affect app controls, dashboards, automations, and sensors. Physical wall switches may still work.
probably_still_ok:
  - Internet and Wi-Fi are not necessarily affected.
  - Physical wall switches may still control many lights.
  - This is usually inconvenient, not dangerous.
household_impact: Some convenience automations and dashboards may be unavailable. Treat this as a smart-home problem first, not as a whole-house infrastructure failure.
first_checks:
  - text: Try the physical wall switch for the affected light.
    action_class: safe
  - text: Check whether ordinary internet browsing works on a device already connected to the household Wi-Fi.
    action_class: safe
  - text: Try opening the Home Assistant dashboard link shown above.
    action_class: safe
escalation_path:
  - If physical switches work and only automations are unavailable, wait for the operator if that is realistic, or contact the trusted helper listed in this manual.
  - If internet or Wi-Fi also appear unavailable, use the separate internet or Wi-Fi runbook when one exists. Do not assume this smart-home symptom is the cause.
  - Secret references identify where access information is kept; this manual does not contain passwords or recovery keys.
do_not_touch:
  - Do not reset the gateway, switches, or Wi-Fi access points while investigating this symptom.
  - Do not delete containers, volumes, backups, or configuration files.
  - Do not change firewall, DNS, VLAN, identity-provider, or password-manager settings.
helper_note: Home Assistant may not have returned correctly after container maintenance. Check container status and logs before any restart or rollback. A restart is not a first check for a stressed household member.
