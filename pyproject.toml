[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadlore-house"
version = "0.0.1"
description = "Local-first household continuity manual generator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
steadlore-house = "steadlore_house.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/steadlore_house"]
